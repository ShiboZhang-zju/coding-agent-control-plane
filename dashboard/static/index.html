<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Agent Control Plane · Dashboard</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主内容</a>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div class="brand-text">
      <strong>Agent Control Plane</strong>
      <span class="brand-sub">只读项目管理驾驶舱 · UI-0</span>
    </div>
  </div>

  <div class="topbar-right">
    <span class="badge badge-readonly" title="本页面不会写入 Ledger">只读</span>
    <div class="refresh-box">
      <label class="refresh-label" for="autoRefresh">
        <input type="checkbox" id="autoRefresh" checked>
        <span>每 10 秒刷新</span>
      </label>
      <button type="button" id="refreshBtn" class="btn btn-ghost">立即刷新</button>
      <button type="button" id="themeBtn" class="btn btn-ghost" title="切换深/浅色">主题</button>
    </div>
  </div>
</header>

<div id="connectionBanner" class="banner banner-hidden" role="status"></div>

<section class="summary" aria-label="总览摘要">
  <div class="summary-grid" id="summaryGrid">
    <!-- populated by app.js -->
  </div>
</section>

<main id="main" class="layout">
  <aside class="sidebar" aria-label="项目导航">
    <div class="sidebar-head">
      <h2>Projects</h2>
      <span class="count" id="projectCount"></span>
    </div>
    <nav id="projectNav" class="project-nav">
      <p class="placeholder">正在加载…</p>
    </nav>
  </aside>

  <section class="content" aria-live="polite">
    <div id="viewState" class="view-state"></div>
    <div id="overviewView" class="view"></div>
    <div id="detailView" class="view" hidden></div>
  </section>
</main>

<footer class="footer">
  <span id="lastRefresh">尚未刷新</span>
  <span class="sep">·</span>
  <span id="ledgerInfo">—</span>
  <span class="sep">·</span>
  <span>数据直接来自 SQLite Ledger；无模拟数据、无模型生成的状态</span>
</footer>

<script src="/app.js"></script>
</body>
</html>
